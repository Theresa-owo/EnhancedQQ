<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnhancedQQ · 消息布局预览</title>
  <link rel="stylesheet" href="/liuli/qq-tokens.css"><link rel="stylesheet" href="/liuli/palette.css"><link rel="stylesheet" href="/liuli/liuli.css"><link rel="stylesheet" href="/liuli/bubbles.css"><link rel="stylesheet" href="/liuli/layout.css">
  <style>
    body { margin: 0; font: 16px "Microsoft YaHei UI", sans-serif; background: #6c8995; --avatar_size_2: 40px; --img-max-width: 180px; --ll-acrylic: 40,48,58; --ll-material-opacity: .6; --ll-shadow-rgb: 0,0,0; --ll-on-glass: #e3e8ed; --ll-on-glass-rgb: 227,232,237; --ll-on-primary-container: #fff; --ll-primary-container: #8d2949; --ll-brand: #ffb1c6; }
    .fixture-controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; position: relative; z-index: 100; }
    .fixture-controls button { padding: 7px 10px; cursor: pointer; }
    #app .ml-list { max-width: 680px; margin: 16px auto; padding: 20px; background: #7999a2; }
    #app .message-container { display: grid; grid-template-areas: "checkbox avatar . nickname nickname ." "checkbox avatar . content status ." "checkbox avatar . tips tips ."; grid-template-columns: auto 40px 12px auto auto minmax(20%, 1fr); align-items: end; }
    #app .message-container--align-right { grid-template-areas: "checkbox . . nickname nickname avatar" "checkbox . status content . avatar" "checkbox . . tips tips avatar"; grid-template-columns: auto minmax(20%, 1fr) 8px auto 0 40px; }
    #app .avatar-span { grid-area: avatar; width: 40px; height: 40px; }
    #app :is(.avatar, .q-avatar) { display: flex; width: 40px; height: 40px; border-radius: 50%; background: #d2d7dd; }
    #app .user-name { grid-area: nickname; }
    #app .message-content__wrapper { grid-area: content; min-width: 0; }
    #app .message-content { display: flex; }
    #app .pic-element { display: block; width: 180px; height: 100px; border-radius: 16px; background: linear-gradient(135deg, #b4e0c4, #6aa3bb); }
    #app .market-face-element { width: 120px; height: 82px; border-radius: 20px; background: #eeb9bb; }
    #app .reaction-panel { display: flex; justify-content: flex-end; gap: 4px; padding-top: 3px; }
    #app .reaction-panel .avatar { width: 18px; height: 18px; background: #ffc78d; }
    #app .reaction-item { border-radius: 20px; padding: 2px 8px; background: #385d80; color: #fff; }
  </style>
</head>
<body data-liuli-dark="1" data-hash="#/main/message">
  <div class="fixture-controls"><button id="avatar">显示自己的头像</button><button id="nickname">昵称移到下方</button><button id="avatar-size">头像大小：40px</button><button id="recycle">模拟复用消息行</button><button id="split">主色和次色</button><button id="enabled">关闭 Telegram 气泡</button></div>
  <div id="app"><div class="aio"><div class="group-panel"><div class="group-chat"><main class="chat-msg-area"><div class="ml-area"><div class="ml-root"><div class="ml-list">
    <div class="ml-item" id="other-1"><div class="message"><div class="message-container message-container--others"><div class="avatar-span" aria-label="对方"><div class="avatar"></div></div><div class="user-name"><span class="text-ellipsis">对方</span></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">第一条消息</span></div></div></div></div></div></div>
    <div class="ml-item" id="other-2"><div class="message"><div class="message-container message-container--others"><div class="avatar-span" aria-label="对方"><div class="avatar"></div></div><div class="user-name"><span class="text-ellipsis">对方</span></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">第二条消息</span></div></div></div></div></div></div>
    <div class="ml-item" id="private-head"><div class="message"><div class="message__timestamp">12:00</div><div class="message-container message-container--others"><div class="avatar-span" aria-label="私聊对方"><div class="q-avatar"></div></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">私聊第一条</span></div></div></div></div></div></div>
    <div class="ml-item" id="private-tail"><div class="message"><div class="message-container message-container--others"><div class="avatar-span" aria-label="私聊对方"><div class="q-avatar"></div></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">私聊最后一条</span></div></div></div></div></div></div>
    <div class="ml-item" id="private-single"><div class="message"><div class="message__timestamp">12:00</div><div class="message-container message-container--others"><div class="avatar-span" aria-label="私聊对方"><div class="q-avatar"></div></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">私聊单条消息</span></div></div></div></div></div></div>
    <div class="ml-item" id="private-media-head"><div class="message"><div class="message__timestamp">12:01</div><div class="message-container message-container--others"><div class="avatar-span" aria-label="私聊对方"><div class="avatar"></div></div><div class="message-content__wrapper"><div class="msg-content-container container--others mix-message__container--pic"><div class="message-content"><span class="pic-element"></span></div></div></div></div></div></div>
    <div class="ml-item" id="private-media-tail"><div class="message"><div class="message-container message-container--others"><div class="avatar-span" aria-label="私聊对方"><div class="avatar"></div></div><div class="message-content__wrapper"><div class="msg-content-container container--others mix-message__container--market-face"><div class="message-content"><div class="market-face-element"></div></div></div><div class="reaction-panel"><div class="reaction-item">❤ 1</div><div class="avatar" aria-label="回应者"></div></div></div></div></div></div>
    <div class="ml-item" data-fixture-record="head"><div class="message"><div class="message__timestamp">12:02</div><div class="message-container message-container--others"><div class="avatar-span"><div class="q-avatar"></div></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">无 DOM 标识的第一条</span></div></div></div></div></div></div>
    <div class="ml-item" data-fixture-record="body"><div class="message"><div class="message-container message-container--others"><div class="avatar-span"><div class="q-avatar"></div></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">无 DOM 标识的中间一条</span></div></div></div></div></div></div>
    <div class="ml-item" data-fixture-record="tail"><div class="message"><div class="message-container message-container--others"><div class="avatar-span"><div class="q-avatar"></div></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">无 DOM 标识的第二条</span></div></div></div></div></div></div>
    <div class="ml-item" id="self-text"><div class="message"><div class="message-container message-container--self message-container--align-right"><div class="message-content__wrapper"><div class="msg-content-container container--self"><div class="message-content"><span class="text-element">自己的文字</span></div></div></div><div class="avatar-span"><div class="avatar"></div></div></div></div></div>
    <div class="ml-item" id="self-text-next"><div class="message"><div class="message-container message-container--self message-container--align-right"><div class="message-content__wrapper"><div class="msg-content-container container--self"><div class="message-content"><span class="text-element">连续消息</span></div></div></div><div class="avatar-span"><div class="avatar"></div></div></div></div></div>
    <div class="ml-item" id="self-image"><div class="message"><div class="message__timestamp">12:01</div><div class="message-container message-container--mix-or-markdown"><div class="message-content__wrapper"><div class="msg-content-container container--self mix-message__container mix-message__container--pic"><div class="message-content"><span class="pic-element"></span></div></div></div><div class="avatar-span"><div class="avatar"></div></div></div></div></div>
    <div class="ml-item" id="self-face"><div class="message"><div class="message__timestamp">12:02</div><div class="message-container message-container--self message-container--align-right"><div class="message-content__wrapper"><div class="msg-content-container container--self mix-message__container--market-face"><div class="message-content"><div class="market-face-element"></div></div></div></div><div class="avatar-span"><div class="avatar"></div></div></div></div></div>
    <div class="ml-item" id="self-reaction"><div class="message"><div class="message__timestamp">12:03</div><div class="message-container message-container--self message-container--align-right"><div class="message-content__wrapper"><div class="msg-content-container container--self"><div class="message-content"><span class="text-element">带回应的消息</span></div></div><div class="reaction-panel"><div class="reaction-item">❤ 1</div><div class="avatar" aria-label="回应者"></div></div></div><div class="avatar-span"><div class="avatar"></div></div></div></div></div>
    <div class="ml-item" id="other-single"><div class="message"><div class="message-container message-container--others"><div class="avatar-span" aria-label="对方"><div class="avatar"></div></div><div class="user-name"><span class="text-ellipsis">对方</span></div><div class="message-content__wrapper"><div class="msg-content-container container--others"><div class="message-content"><span class="text-element">单条消息</span></div></div></div></div></div></div>
    <div class="ml-item" id="other-image"><div class="message"><div class="message__timestamp">12:04</div><div class="message-container message-container--others"><div class="avatar-span" aria-label="对方"><div class="avatar"></div></div><div class="user-name"><span class="text-ellipsis">对方</span></div><div class="message-content__wrapper"><div class="msg-content-container container--others mix-message__container--pic"><div class="message-content"><span class="pic-element"></span></div></div></div></div></div></div>
    <div class="ml-item" id="other-face"><div class="message"><div class="message__timestamp">12:05</div><div class="message-container message-container--others"><div class="avatar-span" aria-label="对方"><div class="avatar"></div></div><div class="user-name"><span class="text-ellipsis">对方</span></div><div class="message-content__wrapper"><div class="msg-content-container container--others mix-message__container--market-face"><div class="message-content"><div class="market-face-element"></div></div></div></div></div></div></div>
    <div class="ml-item" id="other-reply"><div class="message"><div class="message__timestamp">12:06</div><div class="message-container message-container--others"><div class="avatar-span" aria-label="对方"><div class="avatar"></div></div><div class="user-name"><span class="text-ellipsis">对方</span></div><div class="message-content__wrapper"><div class="msg-content-container container--others reply-message__container"><div class="reply-element">引用消息</div><div class="message-content"><span class="text-element">回复正文</span></div></div></div></div></div></div>
  </div></div></div></main></div></div></div></div>
  <script type="module">
    let nameMoves = 0;
    new MutationObserver(records => {
      for (const record of records) for (const node of [...record.addedNodes, ...record.removedNodes]) if (node.nodeType === 1 && node.classList.contains("user-name")) nameMoves++;
      document.body.dataset.fixtureNameMoves = String(nameMoves);
    }).observe(document.querySelector(".ml-list"), { childList: true, subtree: true });
    let config = { features: { telegramBubbles: { enabled: true, nicknamePosition: "above", showSelfAvatar: false } } };
    for (const row of document.querySelectorAll("[data-fixture-record]")) row.querySelector(".message").__VUE__ = [{ props: { msgRecord: { senderUid: "u_fixture" } } }];
    window.LiteLoader = { api: { config: { get: async () => config, set: async (_slug, value) => { config = value; return true; } } } };
    window.EnhancedQQ = { onState() {}, getTelegramAssets: async () => ({ definitions: await (await fetch("../src/vendor/telegram-theme/setting.json")).json(), styles: await Promise.all(["telegram-bubbles.generated.css", "telegram-bubbles.compat.css"].map(async name => (await fetch(`../src/renderer/${name}`)).text())) }) };
    const { installTelegramBubbles } = await import("../src/renderer/telegram-bubbles.js");
    const controller = installTelegramBubbles(); await controller.ready;
    const avatar = document.querySelector("#avatar"), nickname = document.querySelector("#nickname"), avatarSize = document.querySelector("#avatar-size"), enabled = document.querySelector("#enabled");
    avatar.onclick = () => { controller.setCurrent({ ...controller.settings, showSelfAvatar: !controller.settings.showSelfAvatar }); avatar.textContent = controller.settings.showSelfAvatar ? "隐藏自己的头像" : "显示自己的头像"; };
    nickname.onclick = () => { const positions = ["above", "inside", "below"]; const next = positions[(positions.indexOf(controller.settings.nicknamePosition) + 1) % positions.length]; controller.setCurrent({ ...controller.settings, nicknamePosition: next }); nickname.textContent = `昵称位置：${{ above: "上方", inside: "气泡内", below: "下方" }[next]}`; };
    avatarSize.onclick = () => { const sizes = ["40px", "24px", "60px"]; const current = controller.settings.dark["--tg-message-others-avatar-size"] || sizes[0]; const next = sizes[(sizes.indexOf(current) + 1) % sizes.length]; controller.setCurrent({ ...controller.settings, dark: { ...controller.settings.dark, "--tg-message-others-avatar-size": next } }); avatarSize.textContent = `头像大小：${next}`; };
    document.querySelector("#recycle").onclick = () => { const row = document.querySelector('[data-fixture-record="tail"]'); const record = row.querySelector(".message").__VUE__[0].props.msgRecord; record.senderUid = record.senderUid === "u_fixture" ? "u_other" : "u_fixture"; row.querySelector(".text-element").firstChild.nodeValue = record.senderUid === "u_fixture" ? "无 DOM 标识的第二条" : "另一位发送者"; };
    document.querySelector("#split").onclick = () => controller.setCurrent({ ...controller.settings, colorMode: "theme-split" });
    enabled.onclick = () => { controller.setCurrent({ ...controller.settings, enabled: !controller.settings.enabled }); enabled.textContent = controller.settings.enabled ? "关闭 Telegram 气泡" : "开启 Telegram 气泡"; };
  </script>
</body>
</html>
